<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2239;--teal:#0f8b8d;--amber:#f5b841;--bg:#f4f7fa;--mint:#e3f1f0;--line:#d9e2ea;--muted:#5b6b7a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-top:68px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0;scroll-margin-top:68px}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;margin-bottom:28px;letter-spacing:-.02em}
.btn{display:inline-block;background:var(--amber);color:var(--ink);font-weight:700;padding:13px 26px;border-radius:999px;border:0;cursor:pointer;font:inherit;font-weight:700}
.btn:hover{background:#ffc95c}
.btn.alt{background:var(--teal);color:#fff}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
header{position:fixed;top:0;left:0;right:0;height:68px;background:rgba(11,34,57,.96);backdrop-filter:blur(8px);z-index:50;color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.brand img{width:36px;height:36px;border-radius:8px;object-fit:cover}
nav{display:flex;gap:6px}
nav a{padding:8px 14px;border-radius:999px;font-weight:500;font-size:.95rem;color:#cfdbe6}
nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.hr{display:flex;align-items:center;gap:6px}#nav{order:1}#cartBtn{order:2}#burger{order:3}
#cartBtn{position:relative;background:none;border:0;color:#fff;cursor:pointer;padding:8px;border-radius:50%;display:flex}
#cartBtn:hover{background:rgba(255,255,255,.1)}
#cartN{display:none;position:absolute;top:0;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--ink);font-size:.72rem;font-weight:800;align-items:center;justify-content:center;padding:0 4px}
#burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}

/* banner */
.banner{background:var(--ink);color:#fff;padding:84px 0 96px;background-size:cover;background-position:center;position:relative}
.banner.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,34,57,.94) 0%,rgba(11,34,57,.9) 42%,rgba(11,34,57,0) 58%)}
@media(max-width:800px){.banner.img::before{background:rgba(11,34,57,.82)}}
.banner .wrap{position:relative;max-width:1120px}
.banner h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.08;font-weight:800;letter-spacing:-.03em;max-width:820px}
.banner p{font-size:1.15rem;color:#c3d2df;max-width:600px;margin:20px 0 32px}

/* galeri berjalan */
.marquee{overflow:hidden;padding:28px 0;background:var(--mint)}
.track{display:flex;gap:16px;width:max-content;animation:run 40s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track figure{width:260px;height:170px;border-radius:12px;overflow:hidden;flex:none;background:var(--line)}
.track img{width:100%;height:100%;object-fit:cover}
@keyframes run{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.marquee{overflow-x:auto}}

/* profil */
.profile{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.profile img{border-radius:16px;aspect-ratio:4/3;object-fit:cover;width:100%}
.profile p{color:var(--muted);white-space:pre-line;font-size:1.05rem}

/* grid kartu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:16/10;background:var(--mint);object-fit:cover;width:100%}
.card .body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.05rem;line-height:1.35}
.card p{color:var(--muted);font-size:.92rem;flex:1}
.price{font-weight:800;color:var(--teal);font-size:1.15rem}
.date{font-size:.8rem;color:var(--muted)}
.card .btn{text-align:center;padding:10px 18px;font-size:.92rem}
.articles .card{cursor:pointer}
.articles .card:hover{border-color:var(--teal)}
.vid{aspect-ratio:16/9;border:0;width:100%;background:#000}
.empty{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:12px}
.alt-bg{background:#fff}

.products .card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.products .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(11,34,57,.1);border-color:var(--teal)}
.products .card p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.more{font-size:.85rem;font-weight:700;color:var(--teal)}
/* modal produk */
#pmodal{position:fixed;inset:0;background:rgba(11,34,57,.7);z-index:100;display:none;overflow:auto;padding:30px 16px}
#pmodal.on{display:block}
#pmodal .box{background:#fff;max-width:880px;margin:0 auto;border-radius:16px;position:relative;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
#pmodal .pi{background:var(--mint);min-height:280px}
#pmodal .pi img{width:100%;height:100%;object-fit:cover}
#pmodal .pt{padding:32px 28px;display:flex;flex-direction:column;gap:10px}
#pmodal h3{font-size:1.6rem;line-height:1.25}
#pmodal .price{font-size:1.5rem}
#pmodal .txt{white-space:pre-line;color:var(--muted);font-size:1rem}
#pmodal .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
#pmodal .acts .btn{text-align:center;flex:1;min-width:140px}
#pclose{position:absolute;top:8px;right:14px;background:rgba(255,255,255,.9);border:0;border-radius:50%;width:36px;height:36px;font-size:1.5rem;cursor:pointer;z-index:2}

/* keranjang */
#cmodal{position:fixed;inset:0;background:rgba(11,34,57,.7);z-index:110;display:none;overflow:auto;padding:30px 16px}
#cmodal.on{display:block}
#cmodal .cbox{background:#fff;max-width:520px;margin:0 auto;border-radius:16px;padding:26px;position:relative}
#cmodal h3{font-size:1.4rem;margin-bottom:12px}
#cmodal h4{margin:16px 0 6px}
#cclose{position:absolute;top:10px;right:14px;background:none;border:0;font-size:1.8rem;cursor:pointer}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci span{flex:1}.ci button{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.ci.tot{font-size:1.1rem;border:0}
.btn.full{width:100%;margin-top:14px;text-align:center}
.lnk{background:none;border:0;color:var(--teal);font:inherit;font-weight:600;cursor:pointer;margin-top:16px;text-decoration:underline}
#cmodal input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:4px 0 10px}
#cmodal label{font-weight:600;font-size:.88rem}
.bank{white-space:pre-line;background:var(--mint);padding:12px 14px;border-radius:10px;font-weight:600}
.qris{max-width:220px;margin:12px auto;border-radius:8px}
.badge{display:inline-block;background:var(--mint);color:var(--teal);font-weight:700;padding:3px 12px;border-radius:999px;font-size:.85rem;margin-bottom:8px}
.msg{margin-top:10px;font-size:.9rem;color:#c0392b}
#flash{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;z-index:120;display:none;font-size:.9rem}

/* modal artikel */
#modal{position:fixed;inset:0;background:rgba(11,34,57,.7);z-index:100;display:none;overflow:auto;padding:30px 16px}
#modal.on{display:block}
#modal article{background:#fff;max-width:720px;margin:0 auto;border-radius:16px;padding:32px;position:relative}
#modal h3{font-size:1.7rem;line-height:1.25;margin-bottom:6px}
#modal .txt{white-space:pre-line;margin-top:16px;font-size:1.05rem}
#modal img{border-radius:12px;margin-top:14px;width:100%}
#close{position:absolute;top:12px;right:16px;background:none;border:0;font-size:1.8rem;cursor:pointer}

/* footer */
footer{background:var(--ink);color:#c3d2df;padding:56px 0 24px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:56px}
footer h4{color:#fff;margin-bottom:14px}
footer ul{list-style:none;padding:0}
footer li{margin-bottom:8px}
footer .brand{color:#fff;margin-bottom:12px}
.copy{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:18px;font-size:.85rem;text-align:center}

/* loader */
#loader{position:fixed;inset:0;z-index:200;background:#071827;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s;
  background-image:linear-gradient(rgba(15,139,141,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(15,139,141,.08) 1px,transparent 1px);background-size:36px 36px}
#loader.off{opacity:0;visibility:hidden}
.ld{text-align:center;color:#fff;width:min(340px,86vw)}
.ring{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-size:2.2rem;font-weight:800;color:var(--amber)}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.ring::before{border-top-color:var(--teal);border-right-color:var(--teal);animation:spin 1.1s linear infinite}
.ring::after{inset:9px;border-bottom-color:var(--amber);animation:spin 1.7s linear infinite reverse}
.ring img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.lt{font-weight:800;font-size:1.3rem;letter-spacing:.02em}
.term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;color:#7fe3d4;text-align:left;margin:20px 0 14px;min-height:5.2em;line-height:1.7}
.term div{white-space:nowrap;overflow:hidden}
.cur{display:inline-block;width:8px;height:14px;background:#7fe3d4;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.bar{height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:4px;animation:load 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* tombol WA melayang */
#waFloat{position:fixed;right:20px;bottom:20px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:transform .2s}
#waFloat:hover{transform:scale(1.08)}
#waFloat::before{content:"";position:absolute;inset:0;border-radius:50%;background:#25d366;animation:ping 2s ease-out infinite;z-index:-1}
#waFloat svg{width:32px;height:32px;fill:#fff}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring::before,.ring::after,.bar i,#waFloat::before,.cur{animation:none}}

@media(max-width:800px){
  #burger{display:block}
  nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--ink);flex-direction:column;padding:10px 20px 18px}
  nav.on{display:flex}
  .profile,.fgrid{grid-template-columns:1fr}
  section{padding:52px 0}
  #products{grid-template-columns:repeat(2,1fr);gap:12px}
  #products .body{padding:12px}
  #products h3{font-size:.95rem}
  #products .card .btn{padding:8px 10px;font-size:.82rem}
  #pmodal{padding:0}
  #pmodal .box{grid-template-columns:1fr;border-radius:0;min-height:100%}
  #pmodal .pi{min-height:0;aspect-ratio:16/10}
  #pmodal .pt{padding:22px 20px}
}
</style>
</head>
<body>

<div id="loader" role="status" aria-label="Memuat"><div class="ld">
  <div class="ring" id="lring"></div>
  <div class="lt" id="lt"></div>
  <div class="term"><div id="tl"></div><span class="cur"></span></div>
  <div class="bar"><i></i></div>
</div></div>

<a id="waFloat" target="_blank" rel="noopener" aria-label="Chat WhatsApp"><svg viewBox="0 0 24 24"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.38A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.35-2 1.4-.52.05-1.15.07-1.85-.12-.43-.13-.98-.32-1.68-.62-2.97-1.28-4.9-4.27-5.05-4.47-.15-.2-1.2-1.6-1.2-3.05 0-1.45.76-2.16 1.03-2.46.27-.3.6-.37.8-.37h.57c.18 0 .43-.07.67.52.25.6.85 2.07.92 2.22.08.15.13.32.03.52-.1.2-.15.32-.3.5-.15.17-.32.38-.45.52-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.05 1.13 1 2.08 1.32 2.38 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.73.82 2.03.97.3.15.5.22.57.35.08.12.08.72-.17 1.42z"/></svg></a>

<header>
  <div class="wrap">
    <a class="brand" href="#beranda" data-go="beranda"><img id="logo" alt="" hidden><span id="siteTitle">...</span></a>
    <div class="hr"><button id="cartBtn" aria-label="Keranjang"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span id="cartN"></span></button>
    <button id="burger" aria-label="Menu">&#9776;</button>
    <nav id="nav">
      <a href="#beranda" data-go="beranda">Beranda</a>
      <a href="#profil" data-go="profil">Profil</a>
      <a href="#produk" data-go="produk">Produk</a>
      <a href="#artikel" data-go="artikel">Artikel</a>
      <a href="#portofolio" data-go="portofolio">Portofolio</a>
      <a href="#kontak" data-go="kontak">Kontak</a>
    </nav></div>
  </div>
</header>

<main>
  <div id="beranda" class="banner" style="scroll-margin-top:68px">
    <div class="wrap">
      <h1 id="bTitle"></h1>
      <p id="bDesc"></p>
      <a class="btn" id="waBtn" target="_blank" rel="noopener">Konsultasi gratis via WhatsApp</a>
    </div>
  </div>

  <div class="marquee" aria-label="Galeri"><div class="track" id="track"></div></div>

  <section id="profil"><div class="wrap profile">
    <div><h2 id="pTitle"></h2><p id="pText"></p></div>
    <img id="pImg" alt="" hidden>
  </div></section>

  <section id="produk" class="alt-bg"><div class="wrap products">
    <h2>Produk</h2><div class="grid" id="products"></div>
  </div></section>

  <section id="artikel"><div class="wrap articles">
    <h2>Artikel</h2><div class="grid" id="articles"></div>
  </div></section>

  <section id="portofolio" class="alt-bg"><div class="wrap">
    <h2>Portofolio</h2><div class="grid" id="portfolio" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))"></div>
  </div></section>
</main>

<footer id="kontak">
  <div class="wrap">
    <div class="fgrid">
      <div>
        <div class="brand"><img id="flogo" alt="" hidden><span id="fTitle"></span></div>
        <p id="fDesc"></p>
      </div>
      <div><h4>Kontak</h4><ul id="fContact"></ul></div>
    </div>
    <div class="copy">&copy; <span id="yr"></span> <span id="fCopy"></span>. Hak cipta dilindungi.</div>
  </div>
</footer>

<div id="pmodal" role="dialog" aria-modal="true"><div class="box">
  <button id="pclose" aria-label="Tutup">&times;</button>
  <div class="pi" id="pImgBox"></div>
  <div class="pt">
    <h3 id="pmName"></h3><div class="price" id="pmPrice"></div>
    <div class="txt" id="pmText"></div>
    <div class="acts"><button class="btn" id="pmBuy">Beli sekarang</button><button class="btn alt" id="pmAdd">+ Keranjang</button><a class="btn" id="pmAsk" target="_blank" rel="noopener">Tanya via WhatsApp</a></div>
  </div>
</div></div>

<div id="cmodal" role="dialog" aria-modal="true"><div class="cbox"><button id="cclose" aria-label="Tutup">&times;</button><div id="cbody"></div></div></div>
<div id="flash"></div>

<div id="modal" role="dialog" aria-modal="true"><article>
  <button id="close" aria-label="Tutup">&times;</button>
  <div class="date" id="mDate"></div><h3 id="mTitle"></h3>
  <img id="mImg" alt="" hidden><div class="txt" id="mText"></div>
</article></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupiah = n => isNaN(n) || n === '' ? esc(n) : 'Rp ' + Number(n).toLocaleString('id-ID');
const ytId = u => { const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : ''; };
let D;
/* logo & nama di halaman loading: dari cache kunjungan terakhir, atau dari config.js */
(function(){ let c = {}; try { c = JSON.parse(localStorage.getItem('site') || '{}'); } catch(e){}
  const t = c.siteTitle || SITE.siteTitle, l = c.logo || SITE.logo;
  $('lt').textContent = t; document.title = t;
  $('lring').innerHTML = l ? '<img src="' + esc(l) + '" alt="">' : esc(String(t).charAt(0)); })();
/* animasi loader ala terminal */
const LINES = ['> inisialisasi sistem...', '> menghubungkan ke server...', '> mengambil data konten...', '> merender halaman...'];
let li = 0; const t0 = Date.now();
const tick = setInterval(() => { if(li < LINES.length){ const d = document.createElement('div'); d.textContent = LINES[li++]; $('tl').appendChild(d); } }, 420);
function hideLoader(){
  setTimeout(() => { clearInterval(tick); $('loader').classList.add('off'); }, Math.max(0, 1700 - (Date.now() - t0)));
}

function go(id){ const el = $(id); if(el) window.scrollTo({top: id==='beranda'?0:el.offsetTop-68, behavior:'smooth'}); $('nav').classList.remove('on'); }
document.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
$('burger').onclick = () => $('nav').classList.toggle('on');
$('close').onclick = () => $('modal').classList.remove('on');
$('pclose').onclick = () => $('pmodal').classList.remove('on');
$('pmodal').onclick = e => { if(e.target === $('pmodal')) $('pmodal').classList.remove('on'); };
$('modal').onclick = e => { if(e.target === $('modal')) $('modal').classList.remove('on'); };
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ $('cmodal').classList.remove('on'); $('modal').classList.remove('on'); $('pmodal').classList.remove('on'); } });
$('yr').textContent = new Date().getFullYear();

function waLink(s, text){ return 'https://wa.me/' + s.waNumber.replace(/\D/g,'') + '?text=' + encodeURIComponent(text || s.waText); }
function empty(t){ return '<div class="empty">' + t + '</div>'; }

function render(d){
  D = d; const s = d.settings;
  document.title = s.siteTitle;
  try { localStorage.setItem('site', JSON.stringify({ siteTitle: s.siteTitle, logo: s.logo })); } catch(e){}
  ['logo','flogo'].forEach(i => { if(s.logo){ $(i).src = s.logo; $(i).hidden = false; } });
  $('siteTitle').textContent = s.siteTitle; $('fTitle').textContent = s.siteTitle; $('fCopy').textContent = s.siteTitle;
  $('bTitle').textContent = s.bannerTitle; $('bDesc').textContent = s.bannerDesc;
  const b = document.querySelector('.banner');
  if(s.bannerImage){ b.style.backgroundImage = 'url("' + s.bannerImage + '")'; b.classList.add('img'); }
  $('waBtn').href = waLink(s); $('waFloat').href = waLink(s);

  const g = d.gallery.length ? d.gallery : [];
  const items = g.map(x => '<figure><img loading="lazy" src="' + esc(x.image) + '" alt="' + esc(x.caption) + '"></figure>').join('');
  $('track').innerHTML = items + items;
  if(!g.length) document.querySelector('.marquee').style.display = 'none';

  $('pTitle').textContent = s.profileTitle; $('pText').textContent = s.profileText;
  if(s.profileImage){ $('pImg').src = s.profileImage; $('pImg').hidden = false; } else document.querySelector('.profile').style.gridTemplateColumns = '1fr';

  $('products').innerHTML = d.products.length ? d.products.map((p, i) =>
    '<div class="card" tabindex="0" data-i="' + i + '">' + (p.image ? '<img class="ph" loading="lazy" src="' + esc(p.image) + '" alt="">' : '<div class="ph"></div>') +
    '<div class="body"><h3>' + esc(p.name) + '</h3><div class="price">' + rupiah(p.price) + '</div><p>' + esc(p.description) + '</p><span class="more">Lihat detail &rarr;</span>' +
    '<button class="btn alt" data-add="' + esc(p.id) + '">+ Keranjang</button></div></div>').join('')
    : empty('Produk akan segera hadir.');
  CART = CART.filter(id => D.products.some(p => p.id === id)); saveCart();
  document.querySelectorAll('#products .card').forEach(c => {
    const open = () => { const p = D.products[c.dataset.i];
      $('pmName').textContent = p.name; $('pmPrice').textContent = isNaN(p.price) || p.price === '' ? p.price : 'Rp ' + Number(p.price).toLocaleString('id-ID');
      $('pmText').textContent = p.detail || p.description;
      $('pImgBox').innerHTML = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '">' : '';
      $('pmBuy').onclick = () => { $('pmodal').classList.remove('on'); addToCart(p.id, true); };
      $('pmAdd').onclick = () => { addToCart(p.id); $('pmodal').classList.remove('on'); };
      $('pmAsk').href = waLink(s, 'Halo, saya ingin bertanya tentang produk ' + p.name);
      $('pmodal').classList.add('on'); };
    c.onclick = e => { const b = e.target.closest('[data-add]'); if(b){ addToCart(b.dataset.add); return; } open(); };
    c.onkeydown = e => { if(e.key === 'Enter') open(); };
  });

  $('articles').innerHTML = d.articles.length ? d.articles.map((a, i) =>
    '<div class="card" tabindex="0" data-i="' + i + '">' + (a.image ? '<img class="ph" loading="lazy" src="' + esc(a.image) + '" alt="">' : '<div class="ph"></div>') +
    '<div class="body"><div class="date">' + esc(a.date) + '</div><h3>' + esc(a.title) + '</h3><p>' + esc(a.excerpt) + '</p></div></div>').join('')
    : empty('Belum ada artikel.');
  document.querySelectorAll('#articles .card').forEach(c => {
    const open = () => { const a = D.articles[c.dataset.i];
      $('mDate').textContent = a.date; $('mTitle').textContent = a.title; $('mText').textContent = a.content;
      $('mImg').hidden = !a.image; if(a.image) $('mImg').src = a.image; $('modal').classList.add('on'); };
    c.onclick = open; c.onkeydown = e => { if(e.key === 'Enter') open(); };
  });

  $('portfolio').innerHTML = d.portfolio.length ? d.portfolio.map(v => {
    const id = ytId(v.video);
    return '<div class="card">' + (id ? '<iframe class="vid" loading="lazy" allowfullscreen src="https://www.youtube.com/embed/' + id + '"></iframe>'
      : '<video class="vid" controls preload="metadata" src="' + esc(v.video) + '"></video>') +
      '<div class="body"><h3>' + esc(v.title) + '</h3></div></div>';
  }).join('') : empty('Portofolio akan segera hadir.');

  $('fDesc').textContent = s.footerDesc;
  $('fContact').innerHTML = '<li>' + esc(s.address) + '</li><li><a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a></li>' +
    '<li><a target="_blank" rel="noopener" href="' + waLink(s) + '">' + esc(s.phone) + '</a></li>';
}

/* ===== KERANJANG & CHECKOUT ===== */
let CART = []; try { CART = JSON.parse(localStorage.getItem('cart') || '[]'); } catch(e){}
let CUR = null, CUST = {};
const fmt = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const prod = id => D && D.products.find(p => p.id === id);
function saveCart(){ try { localStorage.setItem('cart', JSON.stringify(CART)); } catch(e){}
  $('cartN').textContent = CART.length; $('cartN').style.display = CART.length ? 'flex' : 'none'; }
function flash(m){ const f = $('flash'); f.textContent = m; f.style.display = 'block'; clearTimeout(f._t); f._t = setTimeout(() => f.style.display = 'none', 1800); }
function addToCart(id, openNow){ if(!CART.includes(id)) CART.push(id); saveCart(); openNow ? openCart('cart') : flash('Ditambahkan ke keranjang'); }
function openCart(v, a){ $('cmodal').classList.add('on'); V[v](a); }
$('cartBtn').onclick = () => openCart('cart');
$('cclose').onclick = () => $('cmodal').classList.remove('on');
$('cmodal').onclick = e => { if(e.target === $('cmodal')) $('cmodal').classList.remove('on'); };
const body = () => $('cbody');
const msg = (t) => { const m = $('msg'); if(m) m.textContent = t; };
const busy = (b, t) => { b.disabled = !!t; if(t) b._o = b.textContent; b.textContent = t || b._o; };

const V = {
  cart(){
    const items = CART.map(prod).filter(Boolean), total = items.reduce((a, p) => a + Number(p.price || 0), 0);
    body().innerHTML = '<h3>Keranjang</h3>' + (items.length ?
      items.map(p => '<div class="ci"><span>' + esc(p.name) + '</span><b>' + fmt(p.price) + '</b><button data-rm="' + esc(p.id) + '" aria-label="Hapus">&times;</button></div>').join('') +
      '<div class="ci tot"><span>Total</span><b>' + fmt(total) + '</b></div><button class="btn alt full" id="go">Lanjut checkout</button>'
      : '<div class="empty">Keranjang masih kosong.</div>') +
      '<div style="text-align:center"><button class="lnk" id="trk">Sudah memesan? Cek status / unggah bukti bayar</button></div>';
    body().querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { CART = CART.filter(i => i !== b.dataset.rm); saveCart(); V.cart(); });
    if($('go')) $('go').onclick = () => V.form();
    $('trk').onclick = () => V.track();
  },
  form(){
    body().innerHTML = '<h3>Data pembeli</h3><label>Nama lengkap</label><input id="fn" value="' + esc(CUST.name) + '" autocomplete="name">' +
      '<label>Email (link produk dikirim ke sini)</label><input id="fe" type="email" value="' + esc(CUST.email) + '" autocomplete="email">' +
      '<label>Nomor WhatsApp</label><input id="fw" type="tel" value="' + esc(CUST.wa) + '" autocomplete="tel">' +
      '<div class="msg" id="msg"></div><button class="btn alt full" id="mk">Buat pesanan</button><div style="text-align:center"><button class="lnk" id="bk">Kembali</button></div>';
    $('bk').onclick = () => V.cart();
    $('mk').onclick = e => {
      CUST = { name: $('fn').value.trim(), email: $('fe').value.trim(), wa: $('fw').value.trim() };
      busy(e.target, 'Memproses...');
      google.script.run.withSuccessHandler(o => { CART = []; saveCart(); CUR = { id: o.id, email: CUST.email }; V.pay(o); })
        .withFailureHandler(er => { busy(e.target); msg(er.message.replace(/^Error: /, '')); }).createOrder(CUST, CART);
    };
  },
  pay(o){
    const st = o.status, s = D.settings;
    let h = '<h3>Pesanan ' + esc(o.id) + '</h3><div class="badge">' + esc(st) + '</div>' +
      o.items.map(i => '<div class="ci"><span>' + esc(i.name) + '</span><b>' + fmt(i.price) + '</b></div>').join('') +
      '<div class="ci tot"><span>Total</span><b>' + fmt(o.total) + '</b></div>';
    if(st === 'Menunggu Pembayaran' || st === 'Ditolak'){
      h += (st === 'Ditolak' ? '<p class="msg">Bukti/pembayaran belum dapat kami terima. Silakan unggah ulang atau hubungi kami via WhatsApp.</p>' : '') +
        '<h4>Cara pembayaran</h4><div class="bank">' + esc(s.bankInfo) + '</div>' + (s.qrisImage ? '<img class="qris" src="' + esc(s.qrisImage) + '" alt="QRIS">' : '') +
        '<p style="font-size:.9rem;margin-top:10px">Transfer sesuai total, lalu unggah bukti bayar (gambar/PDF, maks 4 MB). Simpan ID pesanan: <b>' + esc(o.id) + '</b>.</p>' +
        '<input type="file" id="pf" accept="image/*,application/pdf"><div class="msg" id="msg"></div><button class="btn alt full" id="up">Unggah bukti bayar</button>';
    } else if(st === 'Menunggu Verifikasi'){ h += '<p style="margin-top:12px">Bukti bayar sudah kami terima. Setelah diverifikasi, link produk akan dikirim ke email Anda.</p>'; }
    else { h += '<p style="margin-top:12px">Pembayaran terverifikasi. Link unduhan sudah dikirim ke email Anda (cek juga folder spam).</p>'; }
    h += '<div style="text-align:center"><button class="lnk" id="bk">Tutup</button></div>';
    body().innerHTML = h;
    $('bk').onclick = () => $('cmodal').classList.remove('on');
    if($('up')) $('up').onclick = e => {
      const f = $('pf').files[0]; if(!f) return msg('Pilih file bukti bayar dulu');
      if(f.size > 4 * 1024 * 1024) return msg('Ukuran file maksimal 4 MB');
      busy(e.target, 'Mengunggah...');
      const r = new FileReader();
      r.onload = () => google.script.run.withSuccessHandler(V.pay)
        .withFailureHandler(er => { busy(e.target); msg(er.message.replace(/^Error: /, '')); })
        .uploadProof(CUR.id, CUR.email, r.result.split(',')[1], f.name, f.type);
      r.readAsDataURL(f);
    };
  },
  track(){
    body().innerHTML = '<h3>Cek pesanan</h3><label>ID pesanan</label><input id="ti" placeholder="INV2611201234" value="' + esc(CUR ? CUR.id : '') + '">' +
      '<label>Email saat memesan</label><input id="te" type="email" value="' + esc(CUR ? CUR.email : '') + '"><div class="msg" id="msg"></div>' +
      '<button class="btn alt full" id="ck">Cek pesanan</button><div style="text-align:center"><button class="lnk" id="bk">Kembali</button></div>';
    $('bk').onclick = () => V.cart();
    $('ck').onclick = e => { busy(e.target, 'Mencari...'); CUR = { id: $('ti').value.trim().toUpperCase(), email: $('te').value.trim() };
      google.script.run.withSuccessHandler(V.pay).withFailureHandler(er => { busy(e.target); msg(er.message.replace(/^Error: /, '')); }).trackOrder(CUR.id, CUR.email); };
  }
};
saveCart();

google.script.run.withSuccessHandler(d => { render(d); hideLoader(); })
  .withFailureHandler(e => { $('bTitle').textContent = 'Gagal memuat data'; $('bDesc').textContent = e.message; hideLoader(); })
  .getPublicData();
</script>
</body>
</html>
